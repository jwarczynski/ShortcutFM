# NFE sweep for masked discrete diffusion runs (main + no-consistency ablation).
# checkpoint_list_file is generated by scripts/make_masked_checkpoint_list.py;
# the exca submission sweeps generation_shortcut_size = denoising_step_size
# over {2048, 1024, 512, 256} per listed checkpoint (1-8 NFE).

checkpoint_list_file: "configs/generation/individual_runs/qqp/masked_diffusion_checkpoints.txt"
use_ema_weights: true

# Data settings
split: "test"
batch_size: 128
limit_test_batches: null

# Overridden per NFE in the job array
generation_shortcut_size: 2048
denoising_step_size: 2048
seed: 44
output_folder: "generation_outputs/qqp/masked_diffusion/nfe_sweep"

# Evaluation settings
run_evaluation: true
use_fallback_processing: false

# Plot analysis is continuous-only; skipped for masked_diffusion anyway
run_plot_analysis: false

force_regeneration: true

# Use exca for SLURM submission
use_exca: true
infra:
  cluster: slurm
  folder: "jobs/generation"
  timeout_min: 360
  slurm_partition: hgx
  gpus_per_node: 1
  cpus_per_task: 4
  mem_gb: 32
  slurm_additional_parameters:
    nodelist: hgx1

# QQP Baseline 128 — last.ckpt
training_config_path: "checkpoints/qqp/baseline_128/run_y1x54mjl/training_config.yaml"
checkpoint_path: "checkpoints/qqp/baseline_128/run_y1x54mjl/last.ckpt"
use_ema_weights: true
split: "test"
batch_size: 128
limit_test_batches: null
generation_shortcut_size: 2048
denoising_step_size: 2048
seed: 44
output_folder: "generation_outputs/qqp/baseline_128/run_y1x54mjl/scut=2048"

# ParaSCI Shortcut 768 — step=20000 (run_rtikryfi, more recent)
training_config_path: "checkpoints/parasci/scut_768/run_rtikryfi/training_config.yaml"
checkpoint_path: "checkpoints/parasci/scut_768/run_rtikryfi/epoch=60-step=20000-val_bleu=0.0000.ckpt"
use_ema_weights: true
split: "test"
batch_size: 128
limit_test_batches: null
generation_shortcut_size: 2048
denoising_step_size: 2048
seed: 44
output_folder: "generation_outputs/parasci/scut_768/run_rtikryfi/scut=2048"
run_evaluation: true
use_fallback_processing: false
run_plot_analysis: false
force_regeneration: true
use_exca: true
infra:
  cluster: slurm
  folder: "jobs/generation"
  timeout_min: 360
  slurm_partition: hgx
  gpus_per_node: 1
  cpus_per_task: 4
  mem_gb: 32
  slurm_additional_parameters:
    nodelist: hgx1

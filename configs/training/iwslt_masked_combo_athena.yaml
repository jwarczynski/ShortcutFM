# MT: iwslt14/2017 de->en, masked diffusion, winning recipe (Athena).
# Recipe = bert-init (multilingual) + lr 3e-5 + t-clip[0.15,0.95] + myle warmup + EMA.
# This is the consistency-ON arm of the shortcut A/B; the nocons arm sets
# self_consistency_ratio=0 consistency_loss_weight=0 via CLI override.
# mbert: vocab 119547, [MASK]=103, [SEP]=102, [PAD]=0 (native, so vocab="bert" path).
training_data_path: "datasets/tokenized/bert-base-multilingual-cased/iwslt/train"
validation_data_path: "datasets/tokenized/bert-base-multilingual-cased/iwslt/valid"

normalize_embeddings: false
normalize_flow_matching_loss: false

self_consistency_ratio: 0.25
consistency_start_step: 0
shortcut_target_x_start_probability: 0.0

flow_matching_loss_weight: 1.0
consistency_loss_weight: 1.0
nll_loss_weight: 0.0
isotropy_loss_weight: 0.0

cfg_guidance_scale: 1.0
cfg_start_step: null
cfg_probability: 0.0

denoising_step_size: 2048
prediction_shortcut_size: 2048
val_nfe_list: [1, 16]

check_val_every_n_epoch: null
val_interval: 2500
log_train_predictions_every_n_epochs: 5
log_train_predictions_from_n_epochs: 5

# batch 64 (not 128): mbert's 119547 vocab makes logits ~4x QQP's; batch 128 OOMs on
# 40GB A100s, especially during NFE=16 validation denoising. 64x8 keeps eff. batch 512.
batch_size: 64
accumulate_grad_batches: 8
gradient_clipping: 1
max_steps: 30000

limit_train_batches: null
limit_val_batches: null
overfit_batches: 0.0

model:
  type: "masked_diffusion"
  config_name: "bert-base-multilingual-cased"
  tokenizer_config_name: "bert-base-multilingual-cased"
  vocab_size: 119547
  diffusion_steps: 2048
  use_pretrained_weights: true
  use_pretrained_embeddings: true
  freeze_word_embedding: false
  freeze_lm_head: false
  tie_word_embedding: true
  input_dims: 768
  output_dims: 768
  sc_rate: 0.0
  hidden_t_dim: 128
  hidden_shortcut_dim: 128
  default_shortcut: "0"
  projection_activation: "tanh"
  parametrization: "x0"
  scale_time: false
  min_shortcut_size: 1
  mask_token_id: 103
  ce_importance_weighting: "one_over_t"
  consistency_loss_space: "l2_embedding"
  unmask_strategy: "random"
  t_min_frac: 0.15
  t_max_frac: 0.95

time_shortcut_sampling:
  type: timestep_first
  shortcut_sampler: "uniform"
  time_sampler: "uniform"

loss:
  type: mse

optimizer:
  scheduler:
    lr: 3e-5
    type: "myle"
    warmup_steps: 2000
    start_lr: 1e-7

wandb:
  project_name: "Thesis"
  run_name: "mdlm-mt-iwslt-cons"
  enabled: true

checkpoint:
  save_folder: "checkpoints/iwslt/mdlm_mt_iwslt_cons"
  enabled: true

use_exca: true
infra:
  cluster: "slurm"
  folder: "jobs"
  timeout_min: 2880
  mode: "force"
  slurm_partition: "plgrid-gpu-a100"
  gpus_per_node: 4
  tasks_per_node: 4
  cpus_per_task: 4
  slurm_use_srun: true

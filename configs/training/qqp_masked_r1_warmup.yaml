# R2 warmup-2k: myle scheduler, 2000-step warmup (H4)
# Derived from qqp_masked_r1_base: identical to qqp_masked_diffusion.yaml except
# 10k steps and multi-NFE validation. Per-run deltas are applied as CLI overrides
# by scripts/submit_round1.sh. Keep scheduler total_steps=60000 so the LR
# trajectory matches the v1 runs' first 10k steps (their step-10000 checkpoints
# serve as controls).
training_data_path: "datasets/tokenized/bert-base-uncased/QQP-Official/train"
validation_data_path: "datasets/tokenized/bert-base-uncased/QQP-Official/valid"

normalize_embeddings: false
normalize_flow_matching_loss: false

self_consistency_ratio: 0.25
consistency_start_step: 0
shortcut_target_x_start_probability: 0.0

flow_matching_loss_weight: 1.0
consistency_loss_weight: 1.0
nll_loss_weight: 0.0
isotropy_loss_weight: 0.0

cfg_guidance_scale: 1.0
cfg_start_step: null
cfg_probability: 0.0

denoising_step_size: 2048
prediction_shortcut_size: 2048
val_nfe_list: [1, 16]

check_val_every_n_epoch: null
val_interval: 2500
log_train_predictions_every_n_epochs: 5
log_train_predictions_from_n_epochs: 5

batch_size: 128
accumulate_grad_batches: 4
gradient_clipping: 1
max_steps: 10000

limit_train_batches: null
limit_val_batches: null
overfit_batches: 0.0

model:
  type: "masked_diffusion"
  config_name: "bert-base-uncased"
  tokenizer_config_name: "bert-base-uncased"
  diffusion_steps: 2048
  use_pretrained_weights: false
  use_pretrained_embeddings: false
  freeze_word_embedding: false
  freeze_lm_head: false
  tie_word_embedding: true
  input_dims: 768
  output_dims: 768
  sc_rate: 0.0
  hidden_t_dim: 128
  hidden_shortcut_dim: 128
  default_shortcut: "0"
  projection_activation: "tanh"
  parametrization: "x0"
  scale_time: false
  min_shortcut_size: 1
  mask_token_id: 103
  ce_importance_weighting: "one_over_t"
  consistency_loss_space: "l2_embedding"
  unmask_strategy: "random"
  t_min_frac: 0.0
  t_max_frac: 1.0

time_shortcut_sampling:
  type: timestep_first
  shortcut_sampler: "uniform"
  time_sampler: "uniform"

loss:
  type: mse

optimizer:
  scheduler:
    lr: 1e-4
    type: "myle"
    warmup_steps: 2000
    start_lr: 1e-7

wandb:
  project_name: "Thesis"
  run_name: "mdlm-r1-warmup-2k"
  enabled: true

checkpoint:
  save_folder: "checkpoints/qqp/mdlm_r1_warmup-2k"
  enabled: true

use_exca: true
infra:
  cluster: "slurm"
  folder: "jobs"
  timeout_min: 720
  mode: "force"
  slurm_partition: "hgx"
  gpus_per_node: 4
  tasks_per_node: 4
  cpus_per_task: 4
  slurm_use_srun: true
  slurm_additional_parameters:
    nodelist: "hgx1"

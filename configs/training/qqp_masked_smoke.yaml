# Tiny local smoke test for masked discrete diffusion — CPU/MPS, a few steps only
training_data_path: "datasets/tokenized/bert-base-uncased/QQP-Official/train"
validation_data_path: "datasets/tokenized/bert-base-uncased/QQP-Official/valid"

normalize_embeddings: false
normalize_flow_matching_loss: false

self_consistency_ratio: 0.25
consistency_start_step: 0
shortcut_target_x_start_probability: 0.0

flow_matching_loss_weight: 1.0
consistency_loss_weight: 1.0
nll_loss_weight: 0.0
isotropy_loss_weight: 0.0

cfg_guidance_scale: 1.0
cfg_start_step: null
cfg_probability: 0.0

denoising_step_size: 512
prediction_shortcut_size: 512

check_val_every_n_epoch: null
val_interval: 5
log_train_predictions_every_n_epochs: 1000
log_train_predictions_from_n_epochs: 1000
num_val_batches_to_log: 1

batch_size: 4
accumulate_grad_batches: 1
gradient_clipping: 1
max_steps: 10

limit_train_batches: 2
limit_val_batches: 1
overfit_batches: 0.0

model:
  type: "masked_diffusion"
  config_name: "bert-base-uncased"
  tokenizer_config_name: "bert-base-uncased"
  diffusion_steps: 2048
  use_pretrained_weights: false
  use_pretrained_embeddings: false
  freeze_word_embedding: false
  freeze_lm_head: false
  tie_word_embedding: true
  input_dims: 768
  output_dims: 768
  sc_rate: 0.0
  hidden_t_dim: 128
  hidden_shortcut_dim: 128
  default_shortcut: "0"
  projection_activation: "tanh"
  parametrization: "x0"
  scale_time: false
  min_shortcut_size: 1
  mask_token_id: 103
  ce_importance_weighting: "one_over_t"
  consistency_loss_space: "l2_embedding"
  unmask_strategy: "random"

time_shortcut_sampling:
  type: timestep_first
  shortcut_sampler: "uniform"
  time_sampler: "uniform"

loss:
  type: mse

optimizer:
  scheduler:
    lr: 1e-4
    type: "linear"
    start_factor: 1.0
    end_factor: 0.01
    total_steps: 10

wandb:
  project_name: "Thesis"
  run_name: "qqp_masked_smoke"
  enabled: false

checkpoint:
  save_folder: "checkpoints/qqp/masked_smoke"
  enabled: false

use_exca: false
